apiVersion: v1
kind: Pod
metadata:
  name: health-check-app
  labels:
    app: health-check-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - touch /tmp/healthy; sleep 3600
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
